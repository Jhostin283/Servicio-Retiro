name: sistema-billetera-microservicios

services:
  # -------------------------------------------------------------
  # BASE DE DATOS POSTGRESQL (Servicio de Retiros USD)
  # -------------------------------------------------------------
  postgres-servicio-retiros-usd:
    image: postgres:15-alpine
    container_name: contenedor-postgres-servicio-retiros-usd
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in the local .env file}
      POSTGRES_DB: db_servicio_retiros_usd
    ports:
      - "5432:5432"
    volumes:
      - volumen_postgres_data:/var/lib/postgresql/data
    networks:
      - red-microservicios

  # -------------------------------------------------------------
  # SERVICIO DE RETIROS USD (Backend NestJS)
  # -------------------------------------------------------------
  servicio-retiros-usd:
    build:
      context: ./retiros-usd-service
      dockerfile: Dockerfile
    container_name: contenedor-servicio-retiros-usd
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      BILLETERA_USD_URL: ${BILLETERA_USD_URL-http://54.167.69.62}
      DB_HOST: postgres-servicio-retiros-usd
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in the local .env file}
      DB_NAME: db_servicio_retiros_usd
    depends_on:
      postgres-servicio-retiros-usd:
        condition: service_started
    networks:
      - red-microservicios

networks:
  red-microservicios:
    driver: bridge

volumes:
  volumen_postgres_data:
