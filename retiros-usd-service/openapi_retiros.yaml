info:
  title: API de Microservicio de Retiros en Dolares (USD)
  description: >-
    Especificación OpenAPI del microservicio de retiros en dólares estadounidenses (USD).


    ## Alcance del servicio


    El servicio registra solicitudes de retiro, consulta y debita la billetera USD por HTTP, y
    procesa el desembolso mediante una **pasarela simulada**. La pasarela no realiza transferencias
    bancarias reales.


    La billetera y el registro o inicio de sesión de usuarios son responsabilidades de otros
    servicios.


    ## Seguridad y autenticación


    Esta API no implementa autenticación ni autorización. En el entorno de prueba utiliza datos
    ficticios y limita la exposición del servicio.


    ## Validaciones de entrada


    - El monto debe estar entre **USD 1.00 y USD 10,000.00**, con máximo dos decimales.

    - Se requieren el identificador del usuario, el monto y la cuenta de destino.

    - El identificador de usuario debe coincidir con el `user_id` de billetera.

    - El tipo de cuenta es opcional y su valor predeterminado es `AHORROS`.


    ## Estados del retiro


    - **PENDIENTE:** solicitud registrada o débito incierto que requiere revisión manual.

    - **COMPLETADO:** débito confirmado y desembolso simulado exitoso.

    - **RECHAZADO:** billetera no existe o rechazó el débito.

    - **FALLIDO:** error previo al débito o fallo de la pasarela simulada.

    - **RESERVADO:** estado histórico que el flujo HTTP actual no asigna.


    Una respuesta HTTP **201** indica que se registró la solicitud; consulta `estado` y `razonFallo`
    para conocer el resultado.


    ## Integración con billetera


    El contrato de billetera no documenta idempotencia ni reversión para el débito. No repitas una
    solicitud si el resultado del débito es incierto hasta revisarlo con billetera. Si la pasarela
    falla después de un débito confirmado, la devolución requiere gestión manual.


    El archivo `openapi_retiros.yaml` se genera desde esta misma documentación y puede compartirse
    con otros equipos.
  version: 1.0.0
  contact: {}
tags:
  - name: Retiros en Dólares (USD)
    description: Operaciones de retiros en USD.
servers:
  - url: /
    description: Mismo servidor que proporciona esta documentación
components:
  schemas:
    CrearRetiroDto:
      type: object
      properties:
        usuarioId:
          type: string
          description: Identificador del usuario en billetera USD (alias o UUID)
          example: d3b07384-d113-46e4-a123-561234567890
          maxLength: 100
          minLength: 1
        montoUSD:
          type: number
          description: Monto a retirar expresado en Dólares (USD). Mínimo $1.00, Máximo $10,000.00.
          example: 150.5
          minimum: 1
          maximum: 10000
          multipleOf: 0.01
        cuentaDestino:
          type: string
          description: Número de cuenta de destino
          example: '987654321012'
          minLength: 1
        tipoCuenta:
          type: string
          description: Tipo de cuenta bancaria (AHORROS / CORRIENTE)
          example: AHORROS
          default: AHORROS
      required:
        - usuarioId
        - montoUSD
        - cuentaDestino
    RespuestaRetiroDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: e8a11223-99aa-44bb-88cc-112233445566
        usuarioId:
          type: string
          example: d3b07384-d113-46e4-a123-561234567890
        montoUSD:
          type: number
          example: 150.5
        moneda:
          type: string
          example: USD
        cuentaDestino:
          type: string
          example: '987654321012'
        tipoCuenta:
          type: string
          example: AHORROS
        estado:
          type: string
          enum:
            - PENDIENTE
            - RESERVADO
            - COMPLETADO
            - RECHAZADO
            - FALLIDO
          example: PENDIENTE
        movimientoBilleteraId:
          type: string
          description: Identificador del débito confirmado en billetera USD
        billeteraId:
          type: string
          description: Identificador de la billetera debitada
        referenciaBancaria:
          type: string
          example: ACH-88991122
          nullable: true
        razonFallo:
          type: string
          example: Fondos insuficientes
          nullable: true
        fechaCreacion:
          type: string
          format: date-time
          example: '2026-10-06T15:00:00.000Z'
      required:
        - id
        - usuarioId
        - montoUSD
        - moneda
        - cuentaDestino
        - tipoCuenta
        - estado
        - fechaCreacion
    ErrorRespuestaDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 400
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example:
            - El monto mínimo de retiro es de $1.00 USD.
        error:
          type: string
          example: Bad Request
      required:
        - statusCode
        - message
